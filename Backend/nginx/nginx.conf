user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Request paths only — never log query strings, bodies or Authorization headers.
    log_format  main  '$remote_addr [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent $request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_max_body_size 12M;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json text/plain;

    # The public TLS proxy in front of us is the only client; trust its
    # X-Forwarded-For for the real visitor address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream backend_app {
        server backend:8000;
        keepalive 16;
    }

    server {
        # TLS terminates here. The API is reached directly by IP
        # (https://<vps-ip>:<API_HOST_PORT>) with a self-signed certificate
        # created by scripts/deploy.sh and pinned inside the mobile app.
        listen 8443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/certs/api.crt;
        ssl_certificate_key /etc/nginx/certs/api.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:5m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        limit_conn conn_limit 30;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Only the versioned API is served; everything else is a 404.
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header X-Powered-By;
            proxy_read_timeout 60s;
        }

        location /api/v1/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header X-Powered-By;
            proxy_read_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
