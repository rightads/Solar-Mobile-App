services:
  website:
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: solar_prod_website
    restart: always
    ports:
      - "3005:80"

  nginx:
    image: nginx:alpine
    container_name: solar_prod_nginx
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_prod_backend
    restart: always
    command: gunicorn app.main:app -c gunicorn_conf.py
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=prod
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  postgres:
    image: postgres:16-alpine
    container_name: solar_prod_postgres
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
