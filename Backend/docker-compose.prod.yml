services:
  website:
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: solar_prod_website
    restart: always
    ports:
      - "127.0.0.1:3005:80"

  # Public HTTPS entry point for the API, reached by IP (no domain):
  #   https://<vps-ip>:<API_HOST_PORT>/api/v1
  # TLS uses the self-signed certificate in ./certs (created by
  # scripts/deploy.sh, pinned in the app). Rate limiting + security headers.
  # The domain stays with the website on LiteSpeed; this port is separate.
  nginx:
    image: nginx:1.27-alpine
    container_name: solar_prod_nginx
    restart: always
    ports:
      # Host port is picked by scripts/deploy.sh (first free port from 8443)
      # and persisted as API_HOST_PORT in Backend/.env.
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_HOST_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_prod_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      - ENV=prod
      - DEBUG=false
      # Explicit browser origins (overrides any legacy "*" in .env.prod)
      - CORS_ORIGINS=["https://solarpro-app.in","https://www.solarpro-app.in"]
      - TRUST_PROXY_HEADERS=true
      - UPLOAD_DIR=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true

volumes:
  uploads_data:
