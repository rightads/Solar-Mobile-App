services:
  website:
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: solar_prod_website
    restart: always
    ports:
      - "127.0.0.1:3005:80"

  # Internal reverse proxy (rate limiting + headers). It is bound to localhost
  # only: the public TLS endpoint (LiteSpeed/CyberPanel for api.<domain>, or
  # nginx/nginx.ssl.conf.template via scripts/init-ssl.sh) proxies to it.
  # Plain-HTTP API traffic is never exposed to the internet.
  nginx:
    image: nginx:1.27-alpine
    container_name: solar_prod_nginx
    restart: always
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_prod_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      - ENV=prod
      - DEBUG=false
      - TRUST_PROXY_HEADERS=true
      - UPLOAD_DIR=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true

volumes:
  uploads_data:
