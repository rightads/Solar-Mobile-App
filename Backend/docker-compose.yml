services:
  website:
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: solar_website
    restart: unless-stopped
    ports:
      - "3000:80"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - ENV=dev
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-solar_db}
      - TEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/solar_test_db
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME:-solar-uploads}
    depends_on:
      db:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    container_name: solar_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-solar_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: solar_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: solar_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${STORAGE_ACCESS_KEY} ${STORAGE_SECRET_KEY};
      /usr/bin/mc mb myminio/${STORAGE_BUCKET_NAME:-solar-uploads} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/${STORAGE_BUCKET_NAME:-solar-uploads};
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
