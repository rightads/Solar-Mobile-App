name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Backend/**'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Automated Verification & Linting (Continuous Integration)
  # Zero hardcoded credentials or database passwords.
  # ============================================================================
  ci-verify:
    name: Lint & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'Backend/requirements.txt'

      - name: Install dependencies
        working-directory: ./Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Compile Check
        working-directory: ./Backend
        run: |
          python -m compileall app/ alembic/

      - name: Lint Code Quality
        working-directory: ./Backend
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================================
  # Job 2: Continuous Deployment to Hostinger VPS
  # Uses GitHub Secrets exclusively; zero credentials in repository code.
  # ============================================================================
  cd-deploy:
    name: Deploy to Hostinger VPS
    needs: ci-verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DIR: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script_stop: true
          envs: TARGET_DIR
          script: |
            set -e
            DEPLOY_PATH="${TARGET_DIR:-/var/www/solar-mobile-app}"
            echo "Navigating to deploy directory..."
            cd "$DEPLOY_PATH"

            echo "Fetching latest changes from Git..."
            git fetch origin main
            git reset --hard origin/main

            echo "Running deployment script..."
            cd Backend
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
