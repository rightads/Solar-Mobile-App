name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - "website/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Backend/**"
      - "website/**"
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Automated Verification & Linting (Continuous Integration)
  # Zero hardcoded credentials or database passwords.
  # ============================================================================
  ci-verify:
    name: Lint & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "Backend/requirements.txt"

      - name: Install dependencies
        working-directory: ./Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install flake8 pip-audit

      - name: Compile Check
        working-directory: ./Backend
        run: |
          python -m compileall app/ alembic/

      - name: Lint Code Quality
        working-directory: ./Backend
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security regression suite
        working-directory: ./Backend
        run: |
          python -m pytest security_tests -q

      - name: Dependency vulnerability audit
        working-directory: ./Backend
        run: |
          pip-audit -r requirements.txt --strict

  # ============================================================================
  # Job 2: Continuous Deployment to Hostinger VPS
  # Uses GitHub Secrets exclusively; zero credentials in repository code.
  # ============================================================================
  cd-deploy:
    name: Deploy to Hostinger VPS
    needs: ci-verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DIR: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          ENV_PROD_SECRET: ${{ secrets.HOSTINGER_ENV_PROD }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script_stop: true
          envs: TARGET_DIR,ENV_PROD_SECRET
          script: |
            set -e
            DEPLOY_PATH="${TARGET_DIR:-/var/www/solar-mobile-app}"
            echo "Navigating to deploy directory: $DEPLOY_PATH..."
            cd "$DEPLOY_PATH"

            echo "Fetching latest changes from Git..."
            git fetch origin main
            git reset --hard origin/main

            # Sync production environment secrets if configured in GitHub Actions
            if [ -n "$ENV_PROD_SECRET" ]; then
                echo "🔑 Syncing production environment variables to Backend/.env.prod..."
                echo "$ENV_PROD_SECRET" > Backend/.env.prod
                chmod 600 Backend/.env.prod
                echo "✅ Backend/.env.prod synchronized successfully."
            fi

            # The website is built inside its Docker image (npm ci against the
            # committed lockfile) by scripts/deploy.sh; deploy.sh then copies
            # that build to LiteSpeed. No Node toolchain is installed on the
            # host and no remote install script is piped into a root shell.

            # Allow website ports and loopback in firewall
            ufw allow 3000:3005/tcp comment 'Website Ports' 2>/dev/null || true
            ufw allow in on lo 2>/dev/null || true
            ufw allow in on docker0 2>/dev/null || true

            echo "Running deployment script..."
            cd "$DEPLOY_PATH/Backend"
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
