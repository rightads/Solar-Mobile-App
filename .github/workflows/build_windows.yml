name: Build Windows Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'SolarPro/**'
      - '.github/workflows/build_windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop
        working-directory: ./SolarPro

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./SolarPro

      # API endpoint (VPS IP + port) and its pinned certificate fingerprint
      # live in lib/core/constants/app_constants.dart; no overrides here.
      # Build number = CI run number, so installed apps can tell they are older
      # (in-app updater: lib/core/services/update_service.dart).
      - name: Build Windows Desktop App
        run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}
        working-directory: ./SolarPro

      - name: Package Windows Release (ZIP)
        shell: pwsh
        run: |
          if (Test-Path "SolarPro/build/windows/x64/runner/Release") {
            $releaseDir = "SolarPro/build/windows/x64/runner/Release"
          } elseif (Test-Path "SolarPro/build/windows/runner/Release") {
            $releaseDir = "SolarPro/build/windows/runner/Release"
          } else {
            Write-Error "Windows Release build directory not found!"
            exit 1
          }
          Write-Host "Found Windows Release build at: $releaseDir"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "SolarPro-Windows-Release.zip" -Force
          Write-Host "Compressed successfully to SolarPro-Windows-Release.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarPro-Windows-Release
          path: SolarPro-Windows-Release.zip

      # version.json is what installed apps read to decide whether to update.
      # Repository variable WINDOWS_MIN_BUILD forces older builds to update.
      - name: Prepare version manifest
        shell: pwsh
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MIN_BUILD: ${{ vars.WINDOWS_MIN_BUILD }}
        run: |
          $build = [int]$env:GITHUB_RUN_NUMBER
          $notes = (($env:COMMIT_MSG -split "`r?`n")[0])
          if ($notes.Length -gt 300) { $notes = $notes.Substring(0, 300) }
          # Installed apps refuse to apply an update whose zip does not match this hash.
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path "SolarPro-Windows-Release.zip").Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            build        = $build
            version      = "1.0.$build"
            download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/Windows/SolarPro-Windows-Release.zip"
            sha256       = $sha256
            notes        = $notes
            min_build    = [int]("0$env:MIN_BUILD")
          }
          $manifest | ConvertTo-Json -Compress | Set-Content -Path version.json -Encoding utf8NoBOM
          Get-Content version.json

      # The zip is uploaded before version.json so an app never sees a new
      # build number while the old zip is still the download.
      - name: Publish Windows App to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: Windows
          name: "SolarPro Windows 1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          overwrite_files: true
          files: SolarPro-Windows-Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version manifest
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: Windows
          overwrite_files: true
          files: version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
