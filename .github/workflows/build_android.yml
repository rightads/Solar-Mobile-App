name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'SolarPro/**'
      - '.github/workflows/build_android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./SolarPro
        run: flutter pub get

      - name: Configure release signing
        working-directory: ./SolarPro/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to ship a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build Android Release APK
        working-directory: ./SolarPro
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.solarpro-app.in/api/v1' }} \
            --dart-define=API_LIVE_HOST=${{ vars.API_LIVE_HOST || 'https://api.solarpro-app.in' }}

      - name: Rename Release APK
        run: |
          cp SolarPro/build/app/outputs/flutter-apk/app-release.apk SolarPro-Android-v1.5.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarPro-Android-v1.5.0
          path: SolarPro-Android-v1.5.0.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: Android
          name: "SolarPro Android Release"
          draft: false
          prerelease: false
          files: SolarPro-Android-v1.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
