name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'SolarPro/**'
      - '.github/workflows/build_android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        working-directory: ./SolarPro
        run: flutter pub get

      - name: Configure release signing
        working-directory: ./SolarPro/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to ship a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      # API endpoint (VPS IP + port) and its pinned certificate fingerprint
      # live in lib/core/constants/app_constants.dart; no overrides here.
      # Every CI build gets a higher build number (versionCode) so phones can
      # install it over the previous one, and so the app knows its own build
      # for the in-app update check (lib/core/services/update_service.dart).
      - name: Build Android Release APK
        working-directory: ./SolarPro
        run: |
          flutter build apk --release             --build-name=1.0.${{ github.run_number }}             --build-number=${{ github.run_number }}             --dart-define=APP_BUILD=${{ github.run_number }}             --obfuscate --split-debug-info=build/symbols

      # version.json is what installed apps read to decide whether to prompt.
      # Set the repository variable ANDROID_MIN_BUILD to force every older
      # build to update (non-dismissable dialog).
      - name: Prepare APK and version manifest
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MIN_BUILD: ${{ vars.ANDROID_MIN_BUILD }}
        run: |
          cp SolarPro/build/app/outputs/flutter-apk/app-release.apk SolarPro-Android.apk
          python3 - <<'PY'
          import json, os
          build = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          manifest = {
              "build": build,
              "version": f"1.0.{build}",
              "apk_url": f"https://github.com/{repo}/releases/download/Android/SolarPro-Android.apk",
              "notes": ((os.environ.get("COMMIT_MSG") or "").splitlines() or [""])[0][:300],
              "min_build": int(os.environ.get("MIN_BUILD") or 0),
          }
          with open("version.json", "w") as f:
              json.dump(manifest, f)
          print(manifest)
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarPro-Android-1.0.${{ github.run_number }}
          path: SolarPro-Android.apk

      # The APK is uploaded before version.json so an app never sees a new
      # build number while the old APK is still the download.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: Android
          name: "SolarPro Android 1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: SolarPro-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version manifest
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: Android
          overwrite_files: true
          files: version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded APK name
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset Android SolarPro-Android-v1.5.0.apk --repo "$GITHUB_REPOSITORY" -y || true
